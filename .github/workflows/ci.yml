name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - run: npm test
        env:
          VAULT_OFFLINE: '1'
      - run: npm run test:package
      - run: npm audit --omit=dev
  models:
    name: Real models / Ubuntu Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VAULT_MODEL_CACHE: ${{ github.workspace }}/.cache/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: vault-models-bge-e5-v1
      - run: npm ci
      - run: npm run models:prepare
      - run: npm run test:integration
        env:
          VAULT_OFFLINE: '1'
